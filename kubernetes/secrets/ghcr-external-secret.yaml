apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: sre-lab
spec:
  provider:
    gcpsm:
      projectID: cloud-native-platform-513310
      auth:
        workloadIdentity:
          clusterProjectID: cloud-native-platform-513310
          clusterLocation: me-central1-a
          clusterName: portfolio-gke
          serviceAccountRef:
            name: sre-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: sre-lab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfig | toString }}"
  data:
    - secretKey: dockerconfig
      remoteRef:
        key: sre-ghcr-dockerconfig
