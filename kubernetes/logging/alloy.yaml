apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-alloy
  namespace: sre-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-alloy-log-reader
  namespace: sre-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-alloy-log-reader
  namespace: sre-lab
subjects:
  - kind: ServiceAccount
    name: sre-alloy
    namespace: sre-lab
roleRef:
  kind: Role
  name: sre-alloy-log-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-alloy-config
  namespace: sre-lab
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"

      namespaces {
        names = ["sre-lab"]
      }
    }

    discovery.relabel "apps" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex = "sre-gateway|sre-downstream"
        action = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
    }

    loki.source.kubernetes "apps" {
      targets = discovery.relabel.apps.output
      forward_to = [loki.process.apps.receiver]
    }

    loki.process "apps" {
      stage.json {
        expressions = {
          service = "service",
          status = "status",
        }
      }

      stage.labels {
        values = {
          service = "",
          status = "",
        }
      }

      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://sre-loki.sre-lab.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-alloy
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-alloy
  template:
    metadata:
      labels:
        app: sre-alloy
    spec:
      serviceAccountName: sre-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.2
          args:
            - run
            - /etc/alloy/config.alloy
          resources:
            requests:
              cpu: 50m
              memory: 80Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sre-alloy-config
