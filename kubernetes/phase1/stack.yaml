apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-traces-config
  namespace: sre-lab
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      otlphttp/tempo:
        endpoint: http://sre-tempo:4318
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/tempo]
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      trace_idle_period: 10s
    compactor:
      compaction:
        block_retention: 6h
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-tempo
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: sre-tempo}
  template:
    metadata:
      labels: {app: sre-tempo}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.8.2
          args: ["-config.file=/etc/traces/tempo.yaml"]
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp, containerPort: 4318}
          resources:
            requests: {cpu: 80m, memory: 160Mi}
            limits: {cpu: 350m, memory: 384Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/traces}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: sre-traces-config}
        - name: data
          emptyDir: {sizeLimit: 500Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-tempo
  namespace: sre-lab
spec:
  selector: {app: sre-tempo}
  ports:
    - {name: http, port: 3200, targetPort: 3200}
    - {name: otlp, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-otel-collector
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: sre-otel-collector}
  template:
    metadata:
      labels: {app: sre-otel-collector}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.126.0
          args: ["--config=/etc/traces/collector.yaml"]
          ports:
            - {name: otlp-http, containerPort: 4318}
          resources:
            requests: {cpu: 50m, memory: 80Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/traces}
      volumes:
        - name: config
          configMap: {name: sre-traces-config}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-otel-collector
  namespace: sre-lab
spec:
  selector: {app: sre-otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-downstream
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: sre-downstream}
  template:
    metadata:
      labels: {app: sre-downstream}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: api
          image: ghcr.io/fouad-devops-projects/observability-resilience-platform-lab/sre-api:main
          imagePullPolicy: Always
          command: ["uvicorn", "downstream:app", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{name: http, containerPort: 8001}]
          env:
            - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://sre-otel-collector:4318/v1/traces"}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 60m, memory: 90Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-downstream
  namespace: sre-lab
  labels: {app: sre-downstream}
spec:
  selector: {app: sre-downstream}
  ports: [{name: http, port: 8001, targetPort: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-gateway
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: sre-gateway}
  template:
    metadata:
      labels: {app: sre-gateway}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: api
          image: ghcr.io/fouad-devops-projects/observability-resilience-platform-lab/sre-api:main
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: DOWNSTREAM_URL, value: "http://sre-downstream:8001"}
            - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://sre-otel-collector:4318/v1/traces"}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 60m, memory: 90Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-gateway
  namespace: sre-lab
  labels: {app: sre-gateway}
spec:
  selector: {app: sre-gateway}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sre-apis
  namespace: sre-lab
  labels: {release: monitoring}
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [sre-gateway, sre-downstream]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
