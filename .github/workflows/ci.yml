name: SRE Lab Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/requirements-dev.txt
      - run: python -m pytest apps/tests/ -q
      - run: python -m compileall -q apps
      - run: docker compose config --quiet
