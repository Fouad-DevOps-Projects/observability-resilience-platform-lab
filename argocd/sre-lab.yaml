apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fouad-DevOps-Projects/observability-resilience-platform-lab.git
    targetRevision: main
    path: kubernetes/phase1
  destination:
    server: https://kubernetes.default.svc
    namespace: sre-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
