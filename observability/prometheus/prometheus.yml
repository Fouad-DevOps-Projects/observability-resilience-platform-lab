global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
  - job_name: downstream
    metrics_path: /metrics
    static_configs:
      - targets: ["downstream:8001"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
