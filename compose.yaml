name: sre-lab

services:
  gateway:
    build: ./apps
    command: ["uvicorn", "gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DOWNSTREAM_URL: http://downstream:8001
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      APP_LOG_FILE: /var/log/apps/gateway.log
    volumes: [app-logs:/var/log/apps]
    depends_on: [downstream, otel-collector]

  downstream:
    build: ./apps
    command: ["uvicorn", "downstream:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      APP_LOG_FILE: /var/log/apps/downstream.log
    volumes: [app-logs:/var/log/apps]
    depends_on: [otel-collector]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./observability/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./observability/otel/collector.yml:/etc/otel/config.yaml:ro"]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo/tempo.yml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./observability/loki/loki.yml:/etc/loki/local-config.yaml:ro", "loki-data:/loki"]

  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./observability/loki/config.alloy:/etc/alloy/config.alloy:ro
      - app-logs:/var/log/apps:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]

  k6:
    image: grafana/k6:1.1.0
    profiles: ["tools"]
    volumes: ["./tests/load:/scripts:ro"]
    environment:
      TARGET_URL: http://gateway:8000
    depends_on: [gateway]

volumes:
  app-logs:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
